# Daily encrypted backup of the Supabase database.
#
# The free Supabase plan has no backups, so this is the only restore point.
# It also counts as database activity, which keeps the free project from
# being paused after a week without traffic.
#
# THIS REPO IS PUBLIC: any signed-in GitHub user can download workflow
# artifacts. The dump holds customer names, addresses and orders, so it is
# encrypted (AES-256, gpg symmetric) before upload. Never upload it unencrypted.
#
# Contents: the `public` and `goer` schemas (schema + data) and the rows of
# `auth.users`. Restoring is a manual, deliberate step:
#   gpg --decrypt localgo-YYYY-MM-DD.sql.gz.gpg | gunzip > dump.sql
#   psql "$DATABASE_URL" -f dump.sql          # into a fresh/target database
#
# Secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_DB_URL     session-pooler URI, same as Goer's GOER_DATABASE_URL
#   BACKUP_PASSPHRASE   keep a copy outside GitHub; without it a backup is useless

name: database backup

on:
  schedule:
    - cron: "41 7 * * *"
  workflow_dispatch:

concurrency:
  group: database-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Dump, compress and encrypt
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$DB_URL" || { echo "SUPABASE_DB_URL is not set"; exit 1; }
          test -n "$PASSPHRASE" || { echo "BACKUP_PASSPHRASE is not set"; exit 1; }
          out="localgo-$(date -u +%F).sql.gz.gpg"
          # pg_dump must be at least the server's major version; 17 covers
          # Supabase's current Postgres. Runs in the official image.
          {
            docker run --rm -e DB_URL postgres:17 sh -c \
              'pg_dump "$DB_URL" --schema=public --schema=goer --no-owner --no-privileges'
            docker run --rm -e DB_URL postgres:17 sh -c \
              'pg_dump "$DB_URL" --data-only --table=auth.users --no-owner --no-privileges'
          } | gzip -9 \
            | gpg --batch --yes --symmetric --cipher-algo AES256 \
                  --passphrase-fd 3 -o "$out" 3<<<"$PASSPHRASE"
          ls -l "$out"
          echo "BACKUP_FILE=$out" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_FILE }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 90
          if-no-files-found: error
