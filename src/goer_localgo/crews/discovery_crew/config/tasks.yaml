discovery_task:
  description: >
    Answer this customer request: {user_message}

    Use search_menu for a specific food, get_menu when the customer names a
    merchant and wants to browse, and get_product when they ask about one
    product's description, ingredients, or options. If the request is
    ambiguous, ask one short clarifying question. Use the exact catalog names
    and the display_price values returned by tools; never calculate or convert
    prices yourself. If a tool returns an error, explain it briefly and suggest
    what the customer can try. Show no more than five products from a large
    result, and mention when more matches exist.
  expected_output: >
    A short, helpful customer-facing answer grounded in the LocalGo menu tools.
  agent: discovery_agent
